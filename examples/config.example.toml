# Copy to ~/.config/meetscribe/config.toml and edit.
# Do not put API keys or HF tokens in this file.
#   export HF_TOKEN=...          # only for the pyannote backend
#   export OPENAI_API_KEY=...    # optional; llama-server does not need one
#   export OPENAI_BASE_URL=...   # optional override of [llm].base_url

output_dir = "~/Meetings"

[asr]
backend = "auto" # auto | faster-whisper | mlx-whisper | openvino | vulkan | whisper.cpp | openai-api
model = "MediaTek-Research/Breeze-ASR-25"
fallback_model = "openai/whisper-large-v3-turbo"
language = "zh"
device = "auto"
openvino_device = "auto" # auto | GPU | CPU
# model_dir = "~/.cache/meetscribe/models"
# whisper_cpp_bin = "" # or set MEETSCRIBE_WHISPER_CPP
# openai-api: model is the server's model id (e.g. "breeze-asr-25" in LocalAI)
# server_url = "http://127.0.0.1:8080/v1" # or set MEETSCRIBE_ASR_URL

[diarization]
backend = "auto" # auto | track | single-speaker | pyannote | sherpa-onnx
hf_token_env = "HF_TOKEN"

[llm]
# Leave provider, base_url, and model unset to follow the machine.
# Apple Silicon: omlx at http://127.0.0.1:8000/v1
#   model gemma-4-12B-it-4bit (mlx-community/gemma-4-12B-it-4bit, 6.77 GB)
#   fallback Qwen3.5-9B-MLX-4bit (mlx-community/Qwen3.5-9B-MLX-4bit, card says ~5.6 GB)
# Windows/Linux: llama-server at http://127.0.0.1:8080/v1
#   model gemma-4-12b-it (unsloth/gemma-4-12b-it-GGUF:UD-Q4_K_XL, 7.37 GB)
#   fallback qwen3.5-9b (unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL, 5.97 GB)
# provider = "omlx"
# provider = "llama-server"
# base_url = "http://127.0.0.1:8080/v1"
api_key_env = "OPENAI_API_KEY"
polish = true
# Both models support 256K. 16384 keeps the KV cache realistic on an iGPU.
context_tokens = 16384
reserve_tokens = 2048
# Uncomment to override every profile:
# temperature = 0.2

[llm.profiles."gemma-4-12b-it"]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0

[llm.profiles."gemma-4-12B-it-4bit"]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0

[llm.profiles."qwen3.5-9b"]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5

[llm.profiles."Qwen3.5-9B-MLX-4bit"]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5

[capture]
backend = "auto" # auto | file | macos | windows | linux
sample_rate = 48000
chunk_seconds = 5.0
# mic_device = ""
# system_device = ""

[speakers]
# Me = "林可安"
# Remote = "客戶"
# SPEAKER_00 = "陳怡君"
