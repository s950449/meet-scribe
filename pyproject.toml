[project]
name = "meetscribe"
version = "0.2.0"
description = "Local, cross-platform meeting transcription and summarization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "meetscribe contributors" }]
keywords = ["asr", "diarization", "meetings", "whisper", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.26",
    "openai>=1.40",
    "typer>=0.12",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0.3"]
vulkan = ["pywhispercpp>=1.2.0"]
whisper-cpp = ["pywhispercpp>=1.2.0"]
diarization = ["pyannote.audio>=3.3"]
sherpa = ["sherpa-onnx>=1.10"]
audio = ["soundfile>=0.12"]
capture-linux = ["sounddevice>=0.5; sys_platform == 'linux'"]
capture-macos = ["sounddevice>=0.5; sys_platform == 'darwin'"]
capture-windows = ["PyAudioWPatch>=0.2.12; sys_platform == 'win32'"]
mlx = ["mlx-whisper>=0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
openvino = ["openvino-genai>=2024.4.0; sys_platform == 'linux' or sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
meetscribe = "meetscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/meetscribe/py.typed",
    "src/meetscribe/render/templates/*.j2",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Traditional Chinese copy uses fullwidth punctuation and en dashes on purpose.
allowed-confusables = ["，", "（", "）", "：", "？", "–"]

[tool.ruff.lint.isort]
known-first-party = ["meetscribe"]

[tool.ruff.lint.flake8-bugbear]
# Typer options are immutable defaults, not mutable call-time state.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src/meetscribe"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "mlx_whisper",
    "openvino",
    "openvino_genai",
    "pyannote.*",
    "pyaudiowpatch",
    "pywhispercpp.*",
    "sherpa_onnx",
    "sounddevice",
    "soundfile",
]
ignore_missing_imports = true
